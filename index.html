<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日文同步歌詞 V3.2 測試版</title>
<style>
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;max-width:920px;margin:auto;padding:18px;background:#f6f7f9;color:#222}
h1{font-size:22px}.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
input,textarea,button,select{font:inherit}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:9px;margin:5px 0 10px}
textarea{min-height:180px}button{padding:9px 13px;border:0;border-radius:9px;background:#222;color:#fff;margin:3px;cursor:pointer}
.secondary{background:#e7e8eb;color:#222}.danger{background:#b42318}.row{display:flex;gap:8px;flex-wrap:wrap}
.song{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee;padding:10px 0}
.muted{color:#777;font-size:13px}.line{font-size:23px;line-height:1.7;padding:10px;border-radius:10px;cursor:pointer;border-bottom:1px solid #eee}
.line.active{background:#fff0a8;font-weight:700}.line ruby rt{font-size:.55em;font-weight:400}.toolbar{position:sticky;top:0;background:#f6f7f9;padding:8px 0;z-index:6}
.hidden{display:none!important}#player{width:100%;aspect-ratio:16/9}.time{font-variant-numeric:tabular-nums}.timing-focus{padding-bottom:105px}
.timing-preview{text-align:center}.timing-label{font-size:12px;color:#777;margin-bottom:5px}.timing-prev,.timing-next{font-size:17px;color:#777;padding:10px}
.timing-current{font-size:24px;font-weight:700;line-height:1.6;padding:14px 8px;border-top:1px solid #eee;border-bottom:1px solid #eee}
.timing-actions{position:sticky;bottom:8px;z-index:7;background:#fff;padding:10px;border-radius:14px;box-shadow:0 4px 18px #0002}
.timing-actions button{font-size:17px;min-height:52px}.fine{display:flex;gap:4px;flex-wrap:wrap;margin:7px 0 3px 48px}
.fine button{padding:6px 9px;min-height:34px;font-size:14px}.editline{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 0 48px}
.done-title{text-align:center;font-size:23px;font-weight:700;margin:12px 0}.hint{text-align:center;color:#777;font-size:13px}
@media(max-width:600px){
 body{padding:10px}.line{font-size:20px}button{min-height:42px}
 body.timing-on #player{max-height:180px}.timing-current{font-size:22px}
 .fine,.editline{margin-left:0}.timing-actions .row{display:grid;grid-template-columns:1fr 1fr}
}
</style>
<style>
#furiganaControls select{min-width:110px;padding:9px;border-radius:8px}
#lines ruby,#fineLines ruby{ruby-position:over}#lines rt,#fineLines rt{font-size:.56em}
.furi-token{cursor:pointer;border-bottom:1px dotted #71839a}
.furi-overlay{position:fixed;inset:0;background:#0009;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.furi-dialog{background:#202b3a;color:#fff;padding:20px;border-radius:14px;width:min(440px,100%);max-height:90vh;overflow:auto}
.furi-dialog input[type=text]{width:100%;padding:10px;margin:10px 0;color:#111}
.furi-dialog label{display:block;margin:10px 0}
</style><style>
/* V3.2: two distinct views, sharing the original player and song data */
#viewBar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
#viewBar button{flex:1;min-width:95px}
#simplePlayback{margin:0 0 12px;text-align:center}
#simplePlayback button{font-size:19px;min-width:64px;min-height:52px}
#simplePlayback .mainPlay{min-width:95px;background:#222}
body.view-listen #editToolbar,body.view-listen #timing,body.view-listen #furiganaControls,body.view-listen #lines .editline,body.view-listen #lines .fine{display:none!important}
body.view-listen #lines .line{padding:17px 12px;font-size:clamp(20px,4vw,28px);text-align:center;line-height:2.05}
body.view-listen #lines .line .time{display:none}
body.view-listen #lines{min-height:180px;max-height:55vh;overflow-y:auto;scroll-behavior:smooth}
body.view-listen #lines .line.active{background:#fff0a8}
body.view-listen #play{max-width:760px;margin:auto}
#listenModeBar{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:10px}
#listenModeBar select{padding:9px;border-radius:9px;max-width:180px}
body.view-edit #simplePlayback,body.view-edit #listenModeBar{display:none!important}
@media(max-width:600px){body.view-listen #player{max-height:none!important}}
</style><style>
/* V3.2: playback-only inline controls and no furigana editing in listening mode */
body.view-listen #simplePlayback{display:none!important}
body.view-listen #lines .furi-token{pointer-events:none;cursor:inherit;border-bottom:0}
body.view-listen #lines .listen-line-controls{display:flex;align-items:center;justify-content:center;gap:12px;margin:5px 0 0;line-height:1}
body.view-edit #lines .listen-line-controls{display:none!important}
.listen-line-controls button{width:40px;height:38px;min-width:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;font-size:17px;line-height:1}
.listen-line-controls button.listen-line-main{width:48px;height:42px;font-size:21px}
.listen-line-controls button:disabled{opacity:.3}
body.view-listen #lines .line{padding-bottom:13px}
</style><style>
/* V3.2: prevent browser ruby compression from shifting mixed Japanese text */
#lines ruby,#fineLines ruby{ruby-position:over;vertical-align:baseline;white-space:nowrap}
#lines rt,#fineLines rt{font-size:.52em;text-align:center;line-height:1.15;font-weight:normal}
#lines .furi-token,#fineLines .furi-token{white-space:nowrap}
</style><style>
/* V3.2: compact category controls and a fixed mode switch. */
.category-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:10px 0}
.category-toolbar select{min-width:130px;flex:1;padding:10px;border-radius:9px;max-width:300px}
.category-picker{padding:9px 0}.category-picker label{display:inline-flex;align-items:center;gap:6px;margin:4px 8px 4px 0;padding:8px 10px;background:#f0f1f3;border-radius:9px}.category-picker input{width:auto;margin:0}
.song .song-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.song .song-actions button{font-size:13px;padding:7px 9px}
.song .song-tags{font-size:12px;color:#67748a;margin-top:4px}
.quick-view-switch{position:fixed;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:100;padding:11px 17px;border-radius:999px;box-shadow:0 4px 18px #0005;background:#222;color:white;min-height:48px;font-weight:700}
body.view-listen .quick-view-switch,body.view-edit .quick-view-switch{display:block!important}
#lines{scroll-margin-top:16px}
body.view-listen #lines{padding-bottom:75px}
body.view-edit #lines{padding-bottom:75px}
#lines .furi-token{touch-action:manipulation}
</style><style>
/* V3.2 library-first homepage: categories above, songs below */
.home-library{padding:18px 20px}
.library-heading,.library-results-heading{display:flex;justify-content:space-between;align-items:center;gap:10px}
.library-heading h2{margin:4px 0 14px;font-size:23px}
.library-heading .icon-btn{font-size:22px;background:transparent;padding:4px 8px;color:#555}
.home-library #search{background:#f0f1f4;border:0;padding:15px;margin:3px 0 14px;font-size:16px}
.library-categories{display:flex;flex-direction:column;gap:5px}
.library-category{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;color:#252525;border-radius:12px;padding:13px 12px;margin:0;min-height:52px}
.library-category.selected{background:#e9eaed}
.library-category .category-icon{width:23px;text-align:center;font-size:20px;color:#777;flex-shrink:0}
.library-category .category-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650;font-size:17px}
.library-category .category-count{font-variant-numeric:tabular-nums;color:#777}
.library-category .category-arrow{font-size:22px;color:#999}
.library-results-heading{border-top:1px solid #e6e6e6;margin:18px 0 10px;padding-top:16px}
.library-results-heading h3{font-size:18px;margin:0}
.library-song-list{display:flex;flex-direction:column;gap:8px}
.library-song{display:flex;align-items:center;gap:8px;background:#f0f1f4;border-radius:12px;padding:8px}
.library-song-open{display:flex;flex:1;min-width:0;align-items:center;gap:10px;background:transparent;color:#222;text-align:left;padding:9px 4px;margin:0}
.library-song-open .music-icon{font-size:22px;color:#777}
.library-song-info{min-width:0;flex:1}
.library-song-title{display:block;font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.library-song-meta{display:block;font-size:12px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.library-song-menu{background:transparent;color:#555;font-size:23px;padding:4px 10px}
.library-footer{margin-top:20px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.library-footer details{width:100%;margin-top:8px}.library-footer summary{color:#666;cursor:pointer}
@media(max-width:600px){.home-library{padding:15px 12px}.library-category{padding:12px 9px}.library-heading h2{font-size:22px}}
</style><style>
/* V3.2 header icons: matching the earlier folder-plus / database-backup mockup */
.library-top-actions{display:flex;align-items:center;gap:10px}
.library-heading .library-top-actions .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;padding:8px;border:0;border-radius:11px;background:transparent;color:#414651;cursor:pointer}
.library-heading .library-top-actions .icon-btn:active{background:#e8e9ed}
.library-action-svg{width:25px;height:25px;display:block;flex-shrink:0}
</style></head>
<body>
<h1>日文同步歌詞播放器 V3.2 測試版</h1>

<div id="home" class="card home-library">
 <div class="library-heading"><h2>我的歌曲庫</h2><div class="library-top-actions"><button class="secondary icon-btn" onclick="addCategory()" title="新增分類" aria-label="新增分類"><svg class="library-action-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12V7a2 2 0 0 0-2-2h-7l-2-2H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9"/><path d="M17 16h6M20 13v6"/></svg></button><button class="secondary icon-btn" onclick="v29BackupMenu()" title="完整備份／還原" aria-label="完整備份／還原"><svg class="library-action-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3"/><path d="M17 17v6m-3-3 3 3 3-3"/></svg></button></div></div>
 <input id="search" type="search" placeholder="⌕ 搜尋歌曲、歌手、分類" oninput="renderSongs()" aria-label="搜尋歌曲、歌手、分類">
 <select id="categoryFilter" class="hidden" aria-label="目前分類"><option value="all">所有歌曲</option></select>
 <div id="libraryCategories" class="library-categories"></div>
 <div class="library-results-heading"><h3 id="librarySelectedName">所有歌曲</h3><span id="libraryResultCount" class="muted"></span></div>
 <div id="songs" class="library-song-list"></div>
 <div class="library-footer"><button onclick="newSong()">＋ 新增歌曲</button><input id="importFile" type="file" accept="application/json,.json" hidden onchange="v29ImportFile(this)"></div>
</div>

<div id="editor" class="card hidden">
 <h2 id="editorTitle">新增歌曲</h2>
 <input id="title" placeholder="歌名"><input id="artist" placeholder="歌手">
 <input id="youtube" placeholder="YouTube 網址或 Video ID">
 <div class="v32-import-bar"><button type="button" class="secondary" onclick="v32PickPDF()">📄 匯入歌詞 PDF</button><span class="muted">可選用；仍可直接貼上歌詞</span><input id="v32PdfFile" type="file" accept="application/pdf,.pdf" hidden onchange="v32ImportPDF(this)"></div>
 <textarea id="lyrics" placeholder="貼上日文歌詞；一行視為一句，空白行會忽略"></textarea>
 <div id="editorCategories" class="category-picker"></div>
 <div class="row"><button onclick="saveSong()">儲存並開啟</button><button class="secondary" onclick="showHome()">取消</button></div>
</div>

<div id="play" class="hidden">
<div id="viewBar"><button class="secondary" onclick="showHome()">← 歌曲庫</button><button id="listenTab" onclick="setPlayerView('listen')">♫ 播放頁面</button><button id="editTab" class="secondary" onclick="setPlayerView('edit')">✎ 編輯頁面</button></div>
 <div class="toolbar row" id="editToolbar">
  <button onclick="toggleTiming()">半自動對時</button>
  <button class="secondary" onclick="shiftAll(-.1)">整首 −0.1s</button>
  <button class="secondary" onclick="shiftAll(.1)">整首 +0.1s</button>
  <button class="secondary" onclick="editCurrent()">編輯歌曲</button>
 </div>
 <div class="card"><h2 id="nowTitle"></h2><div id="player"></div></div>

<div id="simplePlayback" class="card"><div class="row" style="justify-content:center;align-items:center"><button class="secondary" onclick="listenJump(-1)" aria-label="上一句">⏮ 上一句</button><button id="listenPlayBtn" class="mainPlay" onclick="listenTogglePlay()" aria-label="播放或暫停">▶ 播放</button><button class="secondary" onclick="listenJump(1)" aria-label="下一句">下一句 ⏭</button></div><div class="muted">點選歌詞可從該句重播；暫停後按播放也會從選定句開頭重播。</div></div>
<div id="listenModeBar"><label for="listenFuriMode">歌詞顯示</label><select id="listenFuriMode" onchange="listenChangeFuri(this.value)"><option value="original">原文</option><option value="ruby">振假名</option><option value="hiragana">全平假名</option></select><label for="lyricLead" style="margin-left:10px">歌詞提前 <span id="lyricLeadValue">0.12</span> 秒</label><input id="lyricLead" type="range" min="0" max="0.5" step="0.02" value="0.12" oninput="v26SetLead(this.value)" style="width:105px;vertical-align:middle" aria-label="歌詞反白提前秒數"></div>
 <div id="timing" class="card hidden timing-focus">
  <div><b>半自動對時</b><div class="muted">聽到中央歌詞開始時按「記錄下一句」。需要修歌詞時可先暫停，再合併或拆分。</div></div>
  <div id="timingStatus" class="time" style="text-align:center;margin:12px 0"></div>

  <div id="roughTiming">
   <div class="timing-preview">
    <div class="timing-label">上一句</div><div id="timingPrev" class="timing-prev">—</div>
    <div class="timing-label">下一句（準備記錄）</div><div id="timingCurrent" class="timing-current">—</div>
    <div id="currentEdit" class="row" style="justify-content:center;margin:8px 0"></div>
    <div class="timing-label" style="margin-top:10px">再下一句</div><div id="timingNext" class="timing-next">—</div>
   </div>
  </div>

  <div id="fineTiming" class="hidden">
   <div class="done-title">✓ 初步對時完成</div>
   <div class="hint">可逐句試播與微調時間；也可合併／拆分歌詞。</div>
   <div id="fineLines"></div>
  </div>

  <div class="timing-actions">
   <div class="row">
    <button class="secondary" onclick="replayPrevious()">↶ 從上一句播放</button>
    <button class="secondary" id="pauseBtn" onclick="togglePlayPause()">❚❚ 暫停</button>
    <button class="secondary" onclick="undoMark()">↩ 撤銷上一句對時</button>
    <button id="markBtn" onclick="markNext()">記錄下一句</button>
   </div>
  </div>
 </div>

<div class="card" id="furiganaControls">
 <div class="row"><label for="furiMode">歌詞顯示</label><select id="furiMode" onchange="furiModeChanged()"><option value="original">原文</option><option value="ruby">振假名</option><option value="hiragana">全平假名</option></select>
 <button id="furiAnalyze" class="secondary" onclick="analyzeFurigana()">分析振假名</button></div>
 <div id="furiStatus" class="muted">初次使用請按「分析振假名」；之後會記住每首歌的分析與讀音修正。</div>
 </div>
  <div id="lines" class="card"></div>
</div>
<button id="quickViewSwitch" class="quick-view-switch hidden" onclick="quickToggleView()" aria-label="切換播放或編輯頁面">✎ 編輯</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let songs=JSON.parse(localStorage.getItem('jpSongsV1')||'[]'),current=null,player=null,timingMode=false,markIndex=0,syncTimer=null,activePlayLine=null;
const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem('jpSongsV1',JSON.stringify(songs));
const uid=()=> 'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function showHome(){timingMode=false;document.body.classList.remove('timing-on');$('home').classList.remove('hidden');$('editor').classList.add('hidden');$('play').classList.add('hidden');renderSongs()}
function newSong(){current=null;$('title').value='';$('artist').value='';$('youtube').value='';$('lyrics').value='';$('editorTitle').textContent='新增歌曲';if(typeof renderEditorCategories==='function')renderEditorCategories(null);$('home').classList.add('hidden');$('play').classList.add('hidden');$('editor').classList.remove('hidden')}
function editCurrent(){if(!current)return;$('title').value=current.title;$('artist').value=current.artist;$('youtube').value=current.youtubeVideoId;$('lyrics').value=current.lines.map(x=>x.text).join('\n');$('editorTitle').textContent='編輯歌曲';if(typeof renderEditorCategories==='function')renderEditorCategories(current.songId);$('play').classList.add('hidden');$('editor').classList.remove('hidden')}
function videoId(v){v=v.trim();let m=v.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/);return m?m[1]:v}

function saveSong(){
 let lines=$('lyrics').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(!$('title').value.trim()||!lines.length){alert('請至少輸入歌名與歌詞');return}
 let old=current;
 let obj={schemaVersion:1,songId:old?.songId||'song_'+Date.now(),title:$('title').value.trim(),artist:$('artist').value.trim(),youtubeVideoId:videoId($('youtube').value),readingOverrides:old?.readingOverrides||{},
 lines:lines.map((t,i)=>{let prev=old?.lines?.[i];return {lineId:prev?.text===t?(prev.lineId||uid()):uid(),text:t,startTime:prev?.text===t?prev.startTime:null,tokens:prev?.text===t?prev.tokens:[{tokenId:'T1',text:t,reading:null,override:null}]}})};
 if(typeof saveEditorCategories==='function')saveEditorCategories(obj.songId);let ix=songs.findIndex(x=>x.songId===obj.songId);if(ix>=0)songs[ix]=obj;else songs.push(obj);save();openSong(obj.songId)
}

function renderSongs(){
 let q=$('search').value.toLowerCase();
 $('songs').innerHTML=songs.filter(s=>(s.title+' '+s.artist).toLowerCase().includes(q)).map(s=>`<div class="song"><div><b>${esc(s.title)}</b><div class="muted">${esc(s.artist||'未填歌手')} · ${s.lines.filter(x=>x.startTime!=null).length}/${s.lines.length} 句已對時</div></div><div><button onclick="openSong('${s.songId}')">開啟</button><button class="danger" onclick="delSong('${s.songId}')">刪除</button></div></div>`).join('')||'<p class="muted">尚無歌曲。</p>'
}
function delSong(id){if(confirm('確定刪除這首歌？')){songs=songs.filter(x=>x.songId!==id);save();renderSongs()}}

function openSong(id){
 current=songs.find(x=>x.songId===id); current.lines.forEach(l=>{if(!l.lineId)l.lineId=uid()});
 $('home').classList.add('hidden');$('editor').classList.add('hidden');$('play').classList.remove('hidden');
 $('nowTitle').textContent=current.title+(current.artist?' — '+current.artist:'');renderLines();loadPlayer();recalcMarkIndex();status()
}
function recalcMarkIndex(){markIndex=current.lines.findIndex(x=>x.startTime==null);if(markIndex<0)markIndex=current.lines.length}

function loadPlayer(){
 if(syncTimer){clearInterval(syncTimer);syncTimer=null}
 if(player&&player.destroy)try{player.destroy()}catch(e){}
 if(!current.youtubeVideoId){$('player').innerHTML='<p class="muted">尚未設定 YouTube 影片。</p>';return}
 if(window.YT&&YT.Player) player=new YT.Player('player',{videoId:current.youtubeVideoId,events:{onReady:()=>{syncTimer=setInterval(syncLine,50);updatePauseButton()},onStateChange:updatePauseButton}})
 else setTimeout(loadPlayer,300)
}

function renderLines(){
 $('lines').innerHTML=current.lines.map((l,i)=>`<div class="line" id="line${i}" onclick="seekLine(${i})"><span class="muted time">${l.startTime==null?'--:--':fmt(l.startTime)}</span> ${renderText(l)}
 <div class="editline"><button class="secondary" onclick="event.stopPropagation();mergeNext(${i})" ${i>=current.lines.length-1?'disabled':''}>與下一句合併</button><button class="secondary" onclick="event.stopPropagation();splitLine(${i})">拆分</button></div>
 ${l.startTime!=null?fineButtons(i):''}</div>`).join('')
}
function fineButtons(i){return `<div class="fine"><button class="secondary" onclick="event.stopPropagation();shiftLine(${i},-.5)">−0.5</button><button class="secondary" onclick="event.stopPropagation();shiftLine(${i},-.1)">−0.1</button><button class="secondary linePlayBtn" id="linePlay${i}" onclick="event.stopPropagation();toggleLinePlayback(${i})">▶</button><button class="secondary" onclick="event.stopPropagation();shiftLine(${i},.1)">+0.1</button><button class="secondary" onclick="event.stopPropagation();shiftLine(${i},.5)">+0.5</button></div>`}
function renderText(l){let t=l.tokens?.[0];if(t?.override)return `<ruby>${esc(l.text)}<rt>${esc(t.override)}</rt></ruby>`;return esc(l.text)}

function editReading(i){let l=current.lines[i],v=prompt('輸入這一句要顯示在上方的平假名讀音。\\n留空可移除。',l.tokens?.[0]?.override||'');if(v===null)return;l.tokens=[{tokenId:'T1',text:l.text,reading:null,override:v.trim()||null}];save();renderLines();renderFine()}

<script>
/* V3.2 測試版 usability patch */
let targetIndex=0, splitIndex=null;
function lcsMap(oldLines,newTexts){const a=oldLines.map(x=>x.text),b=newTexts,n=a.length,m=b.length,dp=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);let i=0,j=0,map={};while(i<n&&j<m){if(a[i]===b[j]){map[j]=i;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}return map}
saveSong=function(){let texts=$('lyrics').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!$('title').value.trim()||!texts.length){alert('請至少輸入歌名與歌詞');return}let old=current,map=old?lcsMap(old.lines,texts):{},used=new Set(),newLines=[];texts.forEach((t,i)=>{let oi=map[i],prev=oi!==undefined?old.lines[oi]:null;if(prev){used.add(oi);newLines.push({...prev,text:t});return}if(old){let c=old.lines.map((x,k)=>x.text===t&&!used.has(k)?k:-1).filter(k=>k>=0);if(c.length===1){used.add(c[0]);newLines.push({...old.lines[c[0]],text:t});return}}newLines.push({lineId:uid(),text:t,startTime:null,tokens:[{tokenId:'T1',text:t,reading:null,override:null}]})});let obj={schemaVersion:1,songId:old?.songId||'song_'+Date.now(),title:$('title').value.trim(),artist:$('artist').value.trim(),youtubeVideoId:videoId($('youtube').value),readingOverrides:old?.readingOverrides||{},lines:newLines};if(typeof saveEditorCategories==='function')saveEditorCategories(obj.songId);let ix=songs.findIndex(x=>x.songId===obj.songId);if(ix>=0)songs[ix]=obj;else songs.push(obj);save();openSong(obj.songId)};
function closeSplit(){splitIndex=null;let p=$('splitPanel');if(p){p.classList.add('hidden');p.innerHTML=''}}
function openSplit(i){if(i<0||i>=current.lines.length)return;splitIndex=i;let chars=Array.from(current.lines[i].text);if(chars.length<2){alert('這一句太短，無法拆分');return}let h='<div class="muted">直接點選要拆開的位置：</div><div class="split-text">';chars.forEach((ch,k)=>{h+=`<span>${esc(ch)}</span>`;if(k<chars.length-1)h+=`<button class="split-cut" onclick="confirmSplit(${i},${k+1})">│</button>`});h+='</div><button class="secondary" onclick="closeSplit()">取消</button>';$('splitPanel').innerHTML=h;$('splitPanel').classList.remove('hidden')}
function confirmSplit(i,pos){let l=current.lines[i],c=Array.from(l.text),a=c.slice(0,pos).join('').trim(),b=c.slice(pos).join('').trim();if(!a||!b)return;l.text=a;l.tokens=[{tokenId:'T1',text:a,reading:null,override:null}];current.lines.splice(i+1,0,{lineId:uid(),text:b,startTime:null,tokens:[{tokenId:'T1',text:b,reading:null,override:null}]});targetIndex=i+1;save();closeSplit();renderLines();status()}
function selectRetime(i){targetIndex=i;if(!timingMode)toggleTiming();else status()}
function timingBaseTime(){for(let j=targetIndex-1;j>=0;j--)if(current.lines[j].startTime!=null)return current.lines[j].startTime;return 0}
function timingPlayPause(){if(!player)return;let st=player.getPlayerState?.();if(st===1){player.pauseVideo()}else{activePlayLine=null;player.seekTo(Math.max(0,timingBaseTime()),true);player.playVideo()}setTimeout(updatePauseButton,80)}
function markTarget(){if(!player?.getCurrentTime||!current?.lines?.[targetIndex])return;current.lines[targetIndex].startTime=+player.getCurrentTime().toFixed(2);save();let n=current.lines.findIndex((x,i)=>i>targetIndex&&x.startTime==null);if(n>=0)targetIndex=n;renderLines();status()}
let _toggleTiming=toggleTiming;toggleTiming=function(){_toggleTiming();if(timingMode){let n=current.lines.findIndex(x=>x.startTime==null);targetIndex=n>=0?n:0;status()}};
status=function(){if(!current||!current.lines.length)return;targetIndex=Math.max(0,Math.min(targetIndex,current.lines.length-1));let l=current.lines[targetIndex];$('timingStatus').textContent=`目標：${targetIndex+1} / ${current.lines.length}${l.startTime!=null?' · 目前 '+fmt(l.startTime):' · 待對時'}`;$('roughTiming')?.classList.remove('hidden');$('fineTiming')?.classList.add('hidden');$('timingPrev').textContent=targetIndex>0?current.lines[targetIndex-1].text:'—';$('timingCurrent').innerHTML=esc(l.text)+(l.startTime!=null?' <span class="target-badge">重新對時</span>':' <span class="target-badge">待對時</span>');$('timingNext').textContent=targetIndex+1<current.lines.length?current.lines[targetIndex+1].text:'—';$('currentEdit').innerHTML=`<button class="secondary" onclick="mergeNext(${targetIndex})" ${targetIndex>=current.lines.length-1?'disabled':''}>與下一句合併</button><button class="secondary" onclick="openSplit(${targetIndex})">拆分這一句</button>`;updatePauseButton()};
let _renderLines=renderLines;renderLines=function(){_renderLines();document.querySelectorAll('#lines .line').forEach((el,i)=>{let row=el.querySelector('.editline');if(row&&!row.querySelector('.retimeBtn')){let b=document.createElement('button');b.className='secondary retimeBtn';b.textContent='重新對時';b.onclick=e=>{e.stopPropagation();selectRetime(i)};row.prepend(b)}let bs=row?.querySelectorAll('button');if(bs)bs.forEach(b=>{if(b.textContent==='拆分')b.onclick=e=>{e.stopPropagation();openSplit(i)}})})};
/* Micro-adjust audition: pause, then Play always restarts from that line's current timestamp. */
toggleLinePlayback=function(i){if(!player||!current?.lines?.[i]||current.lines[i].startTime==null)return;let st=player.getPlayerState?.();if(activePlayLine===i&&st===1){player.pauseVideo();updatePauseButton();updateLinePlayButtons();return}activePlayLine=i;player.seekTo(current.lines[i].startTime,true);player.playVideo();updatePauseButton();setTimeout(updateLinePlayButtons,80)};
let _shiftLine=shiftLine;shiftLine=function(i,d){_shiftLine(i,d);if(activePlayLine===i&&player&&current.lines[i].startTime!=null){player.seekTo(current.lines[i].startTime,true);player.playVideo()}};
/* Simplify timing controls and add split panel. */
(function(){let actions=document.querySelector('.timing-actions .row');if(actions)actions.innerHTML='<button class="secondary" id="pauseBtn" onclick="timingPlayPause()">▶ 播放</button><button id="markBtn" onclick="markTarget()">記錄這一句</button>';let ce=$('currentEdit');if(ce&&!$('splitPanel'))ce.insertAdjacentHTML('afterend','<div id="splitPanel" class="split-panel hidden"></div>');updatePauseButton()})();

<script>
/* V3.2 測試版: first-pass semi-auto timing is separate from completed-song maintenance. */
let maintenanceIndex=null;

function ensureMaintenanceHost(i){
  let line=document.getElementById('line'+i);
  if(!line)return null;
  let host=line.querySelector('.inline-maint');
  if(!host){
    host=document.createElement('div');
    host.className='inline-maint';
    host.onclick=e=>e.stopPropagation();
    line.appendChild(host);
  }
  return host;
}
function closeInlineMaintenance(i=null){
  document.querySelectorAll('#lines .inline-maint').forEach(x=>x.remove());
  if(i===null||maintenanceIndex===i)maintenanceIndex=null;
}
function openSplitInline(i){
  if(i<0||i>=current.lines.length)return;
  closeInlineMaintenance();
  maintenanceIndex=i;
  let chars=Array.from(current.lines[i].text);
  if(chars.length<2){alert('這一句太短，無法拆分');return}
  let host=ensureMaintenanceHost(i);
  let h='<div class="muted">直接點選要拆開的位置：</div><div class="split-text">';
  chars.forEach((ch,k)=>{
    h+=`<span>${esc(ch)}</span>`;
    if(k<chars.length-1)h+=`<button class="split-cut" onclick="confirmSplitInline(${i},${k+1})">│</button>`;
  });
  h+='</div><div class="row"><button class="secondary" onclick="closeInlineMaintenance()">取消</button></div>';
  host.innerHTML=h;
}
function confirmSplitInline(i,pos){
  let l=current.lines[i],c=Array.from(l.text),a=c.slice(0,pos).join('').trim(),b=c.slice(pos).join('').trim();
  if(!a||!b)return;
  l.text=a;l.tokens=[{tokenId:'T1',text:a,reading:null,override:null}];
  current.lines.splice(i+1,0,{lineId:uid(),text:b,startTime:null,tokens:[{tokenId:'T1',text:b,reading:null,override:null}]});
  save();recalcMarkIndex();maintenanceIndex=null;renderLines();
}
function openRetimeInline(i){
  if(i<0||i>=current.lines.length)return;
  closeInlineMaintenance();
  maintenanceIndex=i;
  let host=ensureMaintenanceHost(i), l=current.lines[i];
  host.innerHTML=`<div class="inline-retime"><b>${l.startTime==null?'設定這一句時間':'重新對時這一句'}</b>
    <div class="muted" style="margin:5px 0">播放會從上一個已有時間戳的句子開始；只會修改目前這一句。</div>
    <div class="row">
      <button class="secondary" id="inlinePlayBtn" onclick="inlineRetimePlay(${i})">▶ 播放</button>
      <button onclick="inlineRetimeMark(${i})">記錄此句</button>
      <button class="secondary" onclick="closeInlineMaintenance()">取消</button>
    </div></div>`;
}
function previousTimedStart(i){
  for(let j=i-1;j>=0;j--)if(current.lines[j].startTime!=null)return current.lines[j].startTime;
  return 0;
}
function inlineRetimePlay(i){
  if(!player)return;
  let st=player.getPlayerState?.(), b=document.getElementById('inlinePlayBtn');
  if(st===1 && maintenanceIndex===i){
    player.pauseVideo(); if(b)b.textContent='▶ 播放'; return;
  }
  activePlayLine=null;
  player.seekTo(Math.max(0,previousTimedStart(i)),true);
  player.playVideo();
  if(b)b.textContent='❚❚ 暫停';
}
function inlineRetimeMark(i){
  if(!player?.getCurrentTime||!current?.lines?.[i])return;
  current.lines[i].startTime=+player.getCurrentTime().toFixed(2);
  save();maintenanceIndex=null;renderLines();
}
function selectRetime(i){ openRetimeInline(i); }

/* Split is maintenance too: always open directly under the selected lyric line. */
function openSplit(i){ openSplitInline(i); }

/* Rebuild normal lyric controls after every render. */
let _v14RenderLines=renderLines;
renderLines=function(){
  _v14RenderLines();
  document.querySelectorAll('#lines .line').forEach((el,i)=>{
    let row=el.querySelector('.editline');
    if(!row)return;
    let ret=row.querySelector('.retimeBtn');
    if(ret){
      ret.textContent=current.lines[i].startTime==null?'設定時間':'重新對時';
      ret.onclick=e=>{e.stopPropagation();openRetimeInline(i)};
    }
    row.querySelectorAll('button').forEach(b=>{
      if(b.textContent==='拆分')b.onclick=e=>{e.stopPropagation();openSplitInline(i)};
    });
  });
};

/* Semi-auto timing is first-pass only. It always starts at the first untimed line.
   Completed-song single-line maintenance never enters this view. */
let _v14ToggleTiming=toggleTiming;
toggleTiming=function(){
  if(!timingMode){
    let firstUntimed=current?.lines?.findIndex(x=>x.startTime==null) ?? -1;
    if(firstUntimed<0){
      alert('這首歌已完成首次對時。\n要修改單一句，請直接在歌詞頁使用「重新對時」、「拆分」或時間微調。');
      return;
    }
    targetIndex=firstUntimed;
  }
  _v14ToggleTiming();
  if(timingMode){targetIndex=current.lines.findIndex(x=>x.startTime==null);status()}
};

/* In semi-auto mode, splitting still stays inside that mode; normal-page split uses inline editor. */
let _v14Status=status;
status=function(){
  _v14Status();
  if(timingMode){
    let btns=document.querySelectorAll('#currentEdit button');
    btns.forEach(b=>{
      if(b.textContent.includes('拆分')) b.onclick=()=>openSplit(targetIndex);
    });
  }
};
</script>

<script>
/* V3.2 測試版: semi-auto timing can be reused, with explicit start-line selection. */

function closeSemiAutoPicker(){

}

function refreshSemiAutoPickList(){
  let box=document.getElementById('semiAutoPickList'); if(!box)return;
  box.innerHTML=current.lines.map((l,i)=>`<button class="timing-pick-line ${i===semiAutoSelectedIndex?'selected':''}" onclick="pickSemiAutoStart(${i})">
    <span class="timing-pick-time">${l.startTime==null?'--:--':fmt(l.startTime)}</span>

<script>
/* V3.2 測試版: safer mobile semi-auto timing — debounce + session-only undo. */
let semiAutoUndoStack=[];
let semiAutoLastMarkAt=0;
const SEMI_AUTO_DEBOUNCE_MS=400;

function resetSemiAutoUndo(){
  semiAutoUndoStack=[];
  updateSemiAutoUndoButton();
}
function updateSemiAutoUndoButton(){
  let b=document.getElementById('semiAutoUndoBtn');
  if(!b)return;
  b.disabled=semiAutoUndoStack.length===0;
  b.classList.toggle('undo-disabled',semiAutoUndoStack.length===0);
}
function ensureSemiAutoUndoButton(){
  if(!timingMode)return;
  let mark=document.getElementById('markBtn');
  if(!mark)return;
  let row=mark.parentElement;
  if(!row)return;
  let b=document.getElementById('semiAutoUndoBtn');
  if(!b){
    b=document.createElement('button');
    b.id='semiAutoUndoBtn';
    b.className='secondary';
    b.textContent='↶ 上一步';
    b.onclick=undoSemiAutoStep;
    row.insertBefore(b,mark);
  }
  updateSemiAutoUndoButton();
}
function undoSemiAutoStep(){
  if(!semiAutoUndoStack.length||!current)return;
  let step=semiAutoUndoStack.pop();
  let idx=current.lines.findIndex(x=>x.lineId===step.lineId);
  if(idx<0)idx=step.index;
  if(idx<0||idx>=current.lines.length)return;
  current.lines[idx].startTime=step.previousTime;
  targetIndex=idx;
  save();
  renderLines();
  status();
  updateSemiAutoUndoButton();
  // Put the player at the same useful replay baseline as normal semi-auto play.
  if(player?.seekTo){
    player.pauseVideo();
    player.seekTo(Math.max(0,previousTimedStart(idx)),true);
  }
  refreshTimingPlayButton();
}

/* Start of each semi-auto session gets a fresh undo history. */
let _v17StartSemiAuto=startSemiAutoFromSelected;
startSemiAutoFromSelected=function(){
  resetSemiAutoUndo();

  _v17StartSemiAuto();

};

/* Record button: 400 ms mobile double-tap protection + reversible session history. */
markTarget=function(){
  if(!player?.getCurrentTime||!current?.lines?.[targetIndex])return;
  let nowMs=Date.now();
  if(nowMs-semiAutoLastMarkAt<SEMI_AUTO_DEBOUNCE_MS)return;
  semiAutoLastMarkAt=nowMs;

  let idx=targetIndex, line=current.lines[idx], now=player.getCurrentTime();
  if(!isFinite(now))return;

  semiAutoUndoStack.push({
    lineId:line.lineId,
    index:idx,
    previousTime:line.startTime
  });

  line.startTime=+now.toFixed(2);
  save();
  renderLines();

  if(idx<current.lines.length-1){
    targetIndex=idx+1;
    status();
  }else{
    status();
    alert('已到最後一句。半自動對時完成。');
  }
  ensureSemiAutoUndoButton();

  let b=document.getElementById('markBtn');
  if(b){
    b.disabled=true;
    setTimeout(()=>{ if(document.body.contains(b)) b.disabled=false; },SEMI_AUTO_DEBOUNCE_MS);
  }
};

/* Whenever the timing view redraws, keep the undo control visible/stateful. */
let _v17Status=status;
status=function(){
  _v17Status();
  if(timingMode)ensureSemiAutoUndoButton();
};

/* Exiting semi-auto ends the undo session; old song data remains untouched. */
let _v17ToggleTiming=toggleTiming;
toggleTiming=function(){
  let wasTiming=timingMode;
  _v17ToggleTiming();

};
</script>

function furiRomajiConvert(input){

 while(i<src.length){
  const c=src[i],next=src[i+1]||'';
  if(!/[a-z]/.test(c)){text+=c;i++;continue}
  if(c===next&&/[bcdfghjklmpqrstvwxyz]/.test(c)&&c!=='n'){text+='っ';i++;continue}
  if(c==='n'&&(next==="'"||(!/[aiueoyn]/.test(next)))){text+='ん';i+=next==="'"?2:1;continue}
  if(src.slice(i,i+2)==='nn'&&!/[aiueoy]/.test(src[i+2]||'')){text+='ん';i+=2;continue}
  let found=false;
  for(let size=4;size>=1;size--){
   const piece=src.slice(i,i+size);
   if(furiRomanTable[piece]){text+=furiRomanTable[piece];i+=size;found=true;break}
  }
  if(!found){text+=c;i++}
 }

}

 if(![...filter.options].some(o=>o.value===v28Selected))v28Selected='all';
 filter.value=v28Selected;
 const query=$('search').value.trim().toLocaleLowerCase();
 const countFor=(value)=>songs.filter(song=>{
  const tags=v27CategoryNames(song.songId);
  return value==='all'||(value==='uncategorized'?!tags.length:tags.includes(v27Categories.names[Number(value.slice(1))]));
 }).length;
 const entries=[{value:'all',name:'所有歌曲',icon:'▥'},...v27Categories.names.map((name,i)=>({value:'c'+i,name,icon:'▱'})),{value:'uncategorized',name:'未分類',icon:'▱'}];
 $('libraryCategories').innerHTML=entries.map(c=>`<button class="library-category ${v28Selected===c.value?'selected':''}" data-category-value="${c.value}" onclick="v29CategoryClick(event,'${c.value}')" aria-pressed="${v28Selected===c.value}"><span class="category-icon">${c.icon}</span><span class="category-name">${esc(c.name)}</span><span class="category-count">${countFor(c.value)}</span><span class="category-arrow">›</span></button>`).join('');
 const selected=entries.find(x=>x.value===v28Selected);
 $('librarySelectedName').textContent=query?'搜尋結果':selected?.name||'所有歌曲';
 const matching=songs.filter(song=>{
  const tags=v27CategoryNames(song.songId);
  const matchesCategory=v28Selected==='all'||(v28Selected==='uncategorized'?!tags.length:tags.includes(v27Categories.names[Number(v28Selected.slice(1))]));
  const matchesQuery=(song.title+' '+(song.artist||'')+' '+tags.join(' ')).toLocaleLowerCase().includes(query);
  // Search is global, so typing a song or category works regardless of selected folder.
  return (query?matchesQuery:matchesCategory);
 });
 $('libraryResultCount').textContent=matching.length+' 首歌曲';
 $('songs').innerHTML=matching.map(song=>`<div class="library-song"><button class="library-song-open" onclick="openSong('${song.songId}')"><span class="music-icon">♫</span><span class="library-song-info"><span class="library-song-title">${esc(song.title)}</span><span class="library-song-meta">${esc(song.artist||'未填歌手')} · ${song.lines.filter(x=>x.startTime!=null).length}/${song.lines.length} 句已對時</span></span></button><button class="library-song-menu" onclick="v28Menu('${song.songId}')" aria-label="管理歌曲 ${esc(song.title)}">⋯</button></div>`).join('')||'<p class="muted">沒有符合條件的歌曲。</p>';
};

<script>
/* V3.2: long-press category management, whole-library backup and restore. */
let v29HoldTimer=null,v29HoldHandled=false,v29PointerStart=null;
function v29CategoryClick(event,value){
 if(v29HoldHandled){event.preventDefault();v29HoldHandled=false;return}
 v28CategorySelect(value);
}
function v29CancelHold(){if(v29HoldTimer!==null){clearTimeout(v29HoldTimer);v29HoldTimer=null}}
function v29OpenCategoryMenu(value){
 if(!value.startsWith('c'))return;
 const name=v27Categories.names[Number(value.slice(1))];if(!name)return;
 const panel=document.createElement('div');panel.className='furi-overlay';
 panel.innerHTML=`<div class="furi-dialog" role="dialog" aria-modal="true"><h3>管理分類：${esc(name)}</h3><div class="row"><button id="v29Rename">✎ 重新命名</button><button class="danger" id="v29Delete">刪除分類</button><button class="secondary" id="v29Close">取消</button></div><p class="muted">刪除分類不會刪除任何歌曲。</p></div>`;
 document.body.appendChild(panel);
 const close=()=>panel.remove();panel.onclick=e=>{if(e.target===panel)close()};
 panel.querySelector('#v29Close').onclick=close;
 panel.querySelector('#v29Rename').onclick=()=>{
  close();const newName=prompt('重新命名分類',name)?.trim();
  if(!newName||newName===name)return;
  if(v27Categories.names.includes(newName)){alert('分類名稱已存在');return}
  const i=v27Categories.names.indexOf(name);if(i<0)return;
  v27Categories.names[i]=newName;
  for(const id of Object.keys(v27Categories.membership))v27Categories.membership[id]=(v27Categories.membership[id]||[]).map(n=>n===name?newName:n);
  v27SaveCategories();renderSongs();
  if(!$('editor').classList.contains('hidden'))renderEditorCategories(current?.songId||null);
 };
 panel.querySelector('#v29Delete').onclick=()=>{

  v27Categories.names=v27Categories.names.filter(n=>n!==name);
  for(const id of Object.keys(v27Categories.membership))v27Categories.membership[id]=(v27Categories.membership[id]||[]).filter(n=>n!==name);
  v27SaveCategories();v28Selected='all';renderSongs();
  if(!$('editor').classList.contains('hidden'))renderEditorCategories(current?.songId||null);
 };
}
// Delegate listeners: renderSongs replaces category buttons after every filter.
$('libraryCategories').addEventListener('pointerdown',e=>{
 const btn=e.target.closest('.library-category');if(!btn)return;
 v29CancelHold();v29HoldHandled=false;
 v29PointerStart={x:e.clientX,y:e.clientY,value:btn.dataset.categoryValue};
 if(!v29PointerStart.value.startsWith('c'))return;
 v29HoldTimer=setTimeout(()=>{
  v29HoldTimer=null;v29HoldHandled=true;
  if(navigator.vibrate)navigator.vibrate(20);
  v29OpenCategoryMenu(v29PointerStart.value);
 },550);
});
$('libraryCategories').addEventListener('pointermove',e=>{
 if(v29PointerStart&&Math.hypot(e.clientX-v29PointerStart.x,e.clientY-v29PointerStart.y)>12)v29CancelHold();
});
for(const event of ['pointerup','pointercancel','pointerleave'])$('libraryCategories').addEventListener(event,v29CancelHold);
$('libraryCategories').addEventListener('contextmenu',e=>{

 e.preventDefault();v29CancelHold();

});
function v29BackupMenu(){
 const panel=document.createElement('div');panel.className='furi-overlay';
 panel.innerHTML='<div class="furi-dialog" role="dialog" aria-modal="true"><h3>完整資料庫備份／還原</h3><p>包含歌曲、歌詞、對時、自訂分類、振假名分析及手動讀音修正。</p><div class="row"><button id="v29Export">↓ 匯出完整備份</button><button class="secondary" id="v29Import">↑ 匯入備份</button><button class="secondary" id="v29Cancel">取消</button></div></div>';
 document.body.appendChild(panel);const close=()=>panel.remove();
 panel.onclick=e=>{if(e.target===panel)close()};panel.querySelector('#v29Cancel').onclick=close;
 panel.querySelector('#v29Export').onclick=()=>{close();exportAll()};
 panel.querySelector('#v29Import').onclick=()=>{close();$('importFile').click()};
}
function exportAll(){
 const furigana={};
 for(const song of songs){const id=song.songId;const raw=localStorage.getItem(furiStoreKey(id));if(raw!==null){try{furigana[id]=JSON.parse(raw)}catch(e){}}}
 const data={schemaVersion:2,exportedAt:new Date().toISOString(),songs,categories:JSON.parse(JSON.stringify(v27Categories)),furigana};
 const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
 const a=document.createElement('a');a.href=url;a.download='japanese-lyrics-complete-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
}
async function v29ImportFile(input){const file=input.files?.[0];input.value='';if(file)await importAll(file)}
async function importAll(file){
 if(!file)return;
 let d;
 try{
  d=JSON.parse(await file.text());
  if(!d||![1,2].includes(d.schemaVersion)||!Array.isArray(d.songs))throw Error('備份格式不支援');
  if(d.schemaVersion===2){
   if(!d.categories||!Array.isArray(d.categories.names)||!d.categories.membership||typeof d.categories.membership!=='object'||!d.furigana||typeof d.furigana!=='object')throw Error('完整備份內容不完整');
  }
 }catch(e){alert('無法匯入：'+e.message);return}
 const legacy=d.schemaVersion===1;
 const notice=legacy?'這是舊版歌曲備份，僅包含歌曲與對時。現有分類及振假名資料將保留，但可能與匯入歌曲不一致。':'這是完整備份，將一併還原分類與振假名資料。';
 if(!confirm(`即將匯入 ${d.songs.length} 首歌曲。\n${notice}\n\n這會取代目前的歌曲資料，建議先匯出現有完整備份。確定繼續嗎？`))return;
 try{
  const newSongs=JSON.stringify(d.songs);
  // Check available storage before changing the existing library.
  const probe='jpBackupV29:probe';localStorage.setItem(probe,newSongs);localStorage.removeItem(probe);
  if(!legacy){
   for(const song of songs)localStorage.removeItem(furiStoreKey(song.songId));
   for(const [id,record] of Object.entries(d.furigana))localStorage.setItem(furiStoreKey(id),JSON.stringify(record));
   v27Categories={names:d.categories.names,membership:d.categories.membership};v27SaveCategories();
  }
  songs=d.songs;save();current=null;v28Selected='all';$('search').value='';renderSongs();
  alert('匯入完成：'+songs.length+' 首歌曲。'+(legacy?'（舊版備份不包含分類與振假名）':''));
 }catch(e){alert('匯入未完成，請檢查儲存空間：'+e.message)}
}
</script>

<div id="v32PdfOverlay" class="hidden" role="presentation"><div id="v32PdfDialog" role="dialog" aria-modal="true" aria-labelledby="v32PdfHeading">
<h3 id="v32PdfHeading">PDF 歌詞匯入預覽</h3>
<p id="v32PdfStatus">正在讀取…</p>

<p class="muted">只擷取歌詞文字與分行，不匯入時間戳、翻譯或振假名。請檢查文字後再按「儲存並開啟」。PDF 只在本機解析，不會上傳。</p>

<script>
/* V3.2: optional client-side Marumaru-style PDF import. No changes to song storage or editor saving. */
let v32PDFCandidate=null;
function v32PickPDF(){document.getElementById('v32PdfFile').click()}
function v32ClosePDF(){document.getElementById('v32PdfOverlay').classList.add('hidden');v32PDFCandidate=null}
function v32NormalizeLyric(s){
 return String(s||'').normalize('NFKC').replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/[ \t\u3000]+/g,' ').trim();
}
function v32TextFromItems(items,pageNo,pageCount,pageHeight){
 // PDFs containing ruby: use the main text's larger font, not the smaller furigana.
 const eligible=items.filter(x=>x.str&&x.str.trim()&&Number.isFinite(x.transform?.[5]));
 const heights=eligible.map(x=>Math.abs(x.height||x.transform?.[0]||0)).filter(x=>x>0).sort((a,b)=>a-b);
 if(!heights.length)return [];
 const top=heights[Math.floor(heights.length*.90)];
 const threshold=Math.max(12,top*.70);
 let main=eligible.filter(x=>Math.abs(x.height||x.transform?.[0]||0)>=threshold);
 // Main song text is large; title is excluded by position on page 1.
 main=main.filter(x=>!(pageNo===0&&x.transform[5]>pageHeight-98));
 main=main.filter(x=>!/MARUMARU\s*提供/i.test(x.str));
 const rows=[];
 main.forEach(x=>{
  const y=x.transform[5],left=x.transform[4];
  let row=rows.find(r=>Math.abs(r.y-y)<4.5);
  if(!row){row={y,items:[]};rows.push(row)}
  row.items.push({x:left,w:x.width||0,t:x.str});
 });
 rows.sort((a,b)=>b.y-a.y);
 return rows.map(row=>{
  const sorted=row.items.sort((a,b)=>a.x-b.x);
  let out='',right=null;
  sorted.forEach(it=>{
   const part=it.t;
   if(right!==null){
    const gap=it.x-right;
    // Preserve actual lyric spaces between words, but don't insert ruby-induced gaps.
    if(gap>Math.max(5,Math.min(12,part.length*1.2))&&!/\s$/.test(out)&&!/^\s/.test(part))out+=' ';
   }
   out+=part;right=Math.max(right??-Infinity,it.x+it.w);
  });
  return v32NormalizeLyric(out);
 }).filter(Boolean);
}
function v32LoadPdfJs(){
 if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
 if(window.v32PdfJsPromise)return window.v32PdfJsPromise;
 window.v32PdfJsPromise=new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  script.onload=()=>window.pdfjsLib?resolve(window.pdfjsLib):reject(new Error('PDF 解析程式未載入'));
  script.onerror=()=>reject(new Error('無法載入 PDF 解析程式，請確認網路連線'));
  document.head.appendChild(script);
 }).catch(e=>{window.v32PdfJsPromise=null;throw e});
 return window.v32PdfJsPromise;
}
async function v32ImportPDF(input){
 const file=input.files?.[0];input.value='';if(!file)return;
 if(!/\.pdf$/i.test(file.name)&&file.type!=='application/pdf'){alert('請選擇 PDF 檔案');return}
 const overlay=document.getElementById('v32PdfOverlay'),status=document.getElementById('v32PdfStatus'),stats=document.getElementById('v32PdfStats');
 overlay.classList.remove('hidden');status.textContent='正在解析 '+file.name+' …';stats.textContent='';
 document.getElementById('v32PdfPreview').value='';document.getElementById('v32PdfApply').disabled=true;
 try{
  const pdfjs=await v32LoadPdfJs();
  pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pages=[];let title='',artist='';
  for(let i=1;i<=pdf.numPages;i++){
   const page=await pdf.getPage(i),content=await page.getTextContent();
   if(i===1){
    const header=content.items.filter(x=>x.str?.trim()&&x.transform?.[5]>page.view[3]-100)
      .sort((a,b)=>b.transform[5]-a.transform[5]);
    title=v32NormalizeLyric(header[0]?.str||'');
    artist=v32NormalizeLyric(header.slice(1).map(x=>x.str).join(' ')||'');
   }
   pages.push(...v32TextFromItems(content.items,i-1,pdf.numPages,page.view[3]));
  }
  const lyrics=pages.filter(x=>x&&!/^MARUMARU\s*提供$/i.test(x));
  if(!lyrics.length)throw Error('沒有擷取到歌詞。此 PDF 可能是掃描圖片或格式不同。');
  v32PDFCandidate={title,artist};
  document.getElementById('v32PdfPreview').value=lyrics.join('\n');
  stats.textContent=`共 ${pdf.numPages} 頁，辨識 ${lyrics.length} 行。歌名：${title||'未辨識'}；歌手：${artist||'未辨識'}`;
  status.textContent='已擷取歌詞。請確認每行內容，尤其是漢字、空格與跨頁的句子；可直接在下方修改。';
  document.getElementById('v32PdfApply').disabled=false;
 }catch(e){status.textContent='匯入失敗：'+(e.message||e);stats.textContent='原本的歌曲資料沒有被修改。'}
}
function v32ApplyPDF(){
 const lyrics=document.getElementById('v32PdfPreview').value.trim();
 if(!lyrics){alert('沒有可匯入的歌詞');return}
 if(document.getElementById('lyrics').value.trim()&&!confirm('目前編輯欄位已有歌詞，確定要用 PDF 歌詞取代嗎？'))return;
 document.getElementById('lyrics').value=lyrics;
 if(v32PDFCandidate?.title&&!document.getElementById('title').value.trim())document.getElementById('title').value=v32PDFCandidate.title;
 if(v32PDFCandidate?.artist&&!document.getElementById('artist').value.trim())document.getElementById('artist').value=v32PDFCandidate.artist;
 v32ClosePDF();
 document.getElementById('lyrics').scrollIntoView({behavior:'smooth',block:'center'});
}
</script>
