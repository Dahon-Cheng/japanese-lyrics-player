<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日文同步歌詞 V1.2</title>
<style>
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;max-width:920px;margin:auto;padding:18px;background:#f6f7f9;color:#222}
h1{font-size:22px}.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
input,textarea,button,select{font:inherit}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:9px;margin:5px 0 10px}
textarea{min-height:180px}button{padding:9px 13px;border:0;border-radius:9px;background:#222;color:#fff;margin:3px;cursor:pointer}
.secondary{background:#e7e8eb;color:#222}.danger{background:#b42318}.row{display:flex;gap:8px;flex-wrap:wrap}
.song{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee;padding:10px 0}
.muted{color:#777;font-size:13px}.line{font-size:23px;line-height:1.7;padding:10px;border-radius:10px;cursor:pointer;border-bottom:1px solid #eee}
.line.active{background:#fff0a8;font-weight:700}.line ruby rt{font-size:.55em;font-weight:400}.toolbar{position:sticky;top:0;background:#f6f7f9;padding:8px 0;z-index:6}
.hidden{display:none!important}#player{width:100%;aspect-ratio:16/9}.time{font-variant-numeric:tabular-nums}.timing-focus{padding-bottom:105px}
.timing-preview{text-align:center}.timing-label{font-size:12px;color:#777;margin-bottom:5px}.timing-prev,.timing-next{font-size:17px;color:#777;padding:10px}
.timing-current{font-size:24px;font-weight:700;line-height:1.6;padding:14px 8px;border-top:1px solid #eee;border-bottom:1px solid #eee}
.timing-actions{position:sticky;bottom:8px;z-index:7;background:#fff;padding:10px;border-radius:14px;box-shadow:0 4px 18px #0002}
.timing-actions button{font-size:17px;min-height:52px}.fine{display:flex;gap:4px;flex-wrap:wrap;margin:7px 0 3px 48px}
.fine button{padding:6px 9px;min-height:34px;font-size:14px}.editline{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 0 48px}
.done-title{text-align:center;font-size:23px;font-weight:700;margin:12px 0}.hint{text-align:center;color:#777;font-size:13px}
@media(max-width:600px){
 body{padding:10px}.line{font-size:20px}button{min-height:42px}
 body.timing-on #player{max-height:180px}.timing-current{font-size:22px}
 .fine,.editline{margin-left:0}.timing-actions .row{display:grid;grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<h1>日文同步歌詞播放器 V1.2</h1>

<div id="home" class="card">
 <div class="row">
  <button onclick="newSong()">＋ 新增歌曲</button>
  <button class="secondary" onclick="exportAll()">匯出備份</button>
  <label><input id="importFile" type="file" accept="application/json" hidden onchange="importAll(this.files[0])"><button class="secondary" onclick="importFile.click()">匯入備份</button></label>
 </div>
 <input id="search" placeholder="搜尋歌名或歌手" oninput="renderSongs()">
 <div id="songs"></div>
</div>

<div id="editor" class="card hidden">
 <h2 id="editorTitle">新增歌曲</h2>
 <input id="title" placeholder="歌名"><input id="artist" placeholder="歌手">
 <input id="youtube" placeholder="YouTube 網址或 Video ID">
 <textarea id="lyrics" placeholder="貼上日文歌詞；一行視為一句，空白行會忽略"></textarea>
 <div class="row"><button onclick="saveSong()">儲存並開啟</button><button class="secondary" onclick="showHome()">取消</button></div>
</div>

<div id="play" class="hidden">
 <div class="toolbar row">
  <button class="secondary" onclick="showHome()">← 歌曲庫</button>
  <button onclick="toggleTiming()">對時模式</button>
  <button class="secondary" onclick="shiftAll(-.1)">整首 −0.1s</button>
  <button class="secondary" onclick="shiftAll(.1)">整首 +0.1s</button>
  <button class="secondary" onclick="editCurrent()">編輯歌曲</button>
 </div>
 <div class="card"><h2 id="nowTitle"></h2><div id="player"></div></div>

 <div id="timing" class="card hidden timing-focus">
  <div><b>半自動對時</b><div class="muted">聽到中央歌詞開始時按「記錄下一句」。需要修歌詞時可先暫停，再合併或拆分。</div></div>
  <div id="timingStatus" class="time" style="text-align:center;margin:12px 0"></div>

  <div id="roughTiming">
   <div class="timing-preview">
    <div class="timing-label">上一句</div><div id="timingPrev" class="timing-prev">—</div>
    <div class="timing-label">下一句（準備記錄）</div><div id="timingCurrent" class="timing-current">—</div>
    <div id="currentEdit" class="row" style="justify-content:center;margin:8px 0"></div>
    <div class="timing-label" style="margin-top:10px">再下一句</div><div id="timingNext" class="timing-next">—</div>
   </div>
  </div>

  <div id="fineTiming" class="hidden">
   <div class="done-title">✓ 初步對時完成</div>
   <div class="hint">可逐句試播與微調時間；也可合併／拆分歌詞。</div>
   <div id="fineLines"></div>
  </div>

  <div class="timing-actions">
   <div class="row">
    <button class="secondary" onclick="replayPrevious()">↶ 從上一句播放</button>
    <button class="secondary" id="pauseBtn" onclick="togglePlayPause()">❚❚ 暫停</button>
    <button class="secondary" onclick="undoMark()">↩ 撤銷上一句對時</button>
    <button id="markBtn" onclick="markNext()">記錄下一句</button>
   </div>
  </div>
 </div>

 <div id="lines" class="card"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let songs=JSON.parse(localStorage.getItem('jpSongsV1')||'[]'),current=null,player=null,timingMode=false,markIndex=0,syncTimer=null,activePlayLine=null;
const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem('jpSongsV1',JSON.stringify(songs));
const uid=()=> 'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function showHome(){timingMode=false;document.body.classList.remove('timing-on');$('home').classList.remove('hidden');$('editor').classList.add('hidden');$('play').classList.add('hidden');renderSongs()}
function newSong(){current=null;$('title').value='';$('artist').value='';$('youtube').value='';$('lyrics').value='';$('editorTitle').textContent='新增歌曲';$('home').classList.add('hidden');$('play').classList.add('hidden');$('editor').classList.remove('hidden')}
function editCurrent(){if(!current)return;$('title').value=current.title;$('artist').value=current.artist;$('youtube').value=current.youtubeVideoId;$('lyrics').value=current.lines.map(x=>x.text).join('\n');$('editorTitle').textContent='編輯歌曲';$('play').classList.add('hidden');$('editor').classList.remove('hidden')}
function videoId(v){v=v.trim();let m=v.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/);return m?m[1]:v}

function saveSong(){
 let lines=$('lyrics').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(!$('title').value.trim()||!lines.length){alert('請至少輸入歌名與歌詞');return}
 let old=current;
 let obj={schemaVersion:1,songId:old?.songId||'song_'+Date.now(),title:$('title').value.trim(),artist:$('artist').value.trim(),youtubeVideoId:videoId($('youtube').value),readingOverrides:old?.readingOverrides||{},
 lines:lines.map((t,i)=>{let prev=old?.lines?.[i];return {lineId:prev?.text===t?(prev.lineId||uid()):uid(),text:t,startTime:prev?.text===t?prev.startTime:null,tokens:prev?.text===t?prev.tokens:[{tokenId:'T1',text:t,reading:null,override:null}]}})};
 let ix=songs.findIndex(x=>x.songId===obj.songId);if(ix>=0)songs[ix]=obj;else songs.push(obj);save();openSong(obj.songId)
}

function renderSongs(){
 let q=$('search').value.toLowerCase();
 $('songs').innerHTML=songs.filter(s=>(s.title+' '+s.artist).toLowerCase().includes(q)).map(s=>`<div class="song"><div><b>${esc(s.title)}</b><div class="muted">${esc(s.artist||'未填歌手')} · ${s.lines.filter(x=>x.startTime!=null).length}/${s.lines.length} 句已對時</div></div><div><button onclick="openSong('${s.songId}')">開啟</button><button class="danger" onclick="delSong('${s.songId}')">刪除</button></div></div>`).join('')||'<p class="muted">尚無歌曲。</p>'
}
function delSong(id){if(confirm('確定刪除這首歌？')){songs=songs.filter(x=>x.songId!==id);save();renderSongs()}}

function openSong(id){
 current=songs.find(x=>x.songId===id); current.lines.forEach(l=>{if(!l.lineId)l.lineId=uid()});
 $('home').classList.add('hidden');$('editor').classList.add('hidden');$('play').classList.remove('hidden');
 $('nowTitle').textContent=current.title+(current.artist?' — '+current.artist:'');renderLines();loadPlayer();recalcMarkIndex();status()
}
function recalcMarkIndex(){markIndex=current.lines.findIndex(x=>x.startTime==null);if(markIndex<0)markIndex=current.lines.length}

function loadPlayer(){
 if(syncTimer){clearInterval(syncTimer);syncTimer=null}
 if(player&&player.destroy)try{player.destroy()}catch(e){}
 if(!current.youtubeVideoId){$('player').innerHTML='<p class="muted">尚未設定 YouTube 影片。</p>';return}
 if(window.YT&&YT.Player) player=new YT.Player('player',{videoId:current.youtubeVideoId,events:{onReady:()=>{syncTimer=setInterval(syncLine,200);updatePauseButton()},onStateChange:updatePauseButton}})
 else setTimeout(loadPlayer,300)
}

function renderLines(){
 $('lines').innerHTML=current.lines.map((l,i)=>`<div class="line" id="line${i}" onclick="seekLine(${i})"><span class="muted time">${l.startTime==null?'--:--':fmt(l.startTime)}</span> ${renderText(l)}
 <div class="editline"><button class="secondary" onclick="event.stopPropagation();editReading(${i})">讀音</button><button class="secondary" onclick="event.stopPropagation();mergeNext(${i})" ${i>=current.lines.length-1?'disabled':''}>與下一句合併</button><button class="secondary" onclick="event.stopPropagation();splitLine(${i})">拆分</button></div>
 ${l.startTime!=null?fineButtons(i):''}</div>`).join('')
}
function fineButtons(i){return `<div class="fine"><button class="secondary" onclick="event.stopPropagation();shiftLine(${i},-.5)">−0.5</button><button class="secondary" onclick="event.stopPropagation();shiftLine(${i},-.1)">−0.1</button><button class="secondary linePlayBtn" id="linePlay${i}" onclick="event.stopPropagation();toggleLinePlayback(${i})">▶</button><button class="secondary" onclick="event.stopPropagation();shiftLine(${i},.1)">+0.1</button><button class="secondary" onclick="event.stopPropagation();shiftLine(${i},.5)">+0.5</button></div>`}
function renderText(l){let t=l.tokens?.[0];if(t?.override)return `<ruby>${esc(l.text)}<rt>${esc(t.override)}</rt></ruby>`;return esc(l.text)}

function editReading(i){let l=current.lines[i],v=prompt('輸入這一句要顯示在上方的平假名讀音。\\n留空可移除。',l.tokens?.[0]?.override||'');if(v===null)return;l.tokens=[{tokenId:'T1',text:l.text,reading:null,override:v.trim()||null}];save();renderLines();renderFine()}
function seekLine(i){let t=current.lines[i].startTime;if(t!=null&&player?.seekTo){activePlayLine=i;player.seekTo(Math.max(0,t),true);player.playVideo();updatePauseButton()}}


function toggleLinePlayback(i){
 if(!player||!current?.lines?.[i])return;
 let t=current.lines[i].startTime;
 if(t==null)return;
 let state=player.getPlayerState?.();
 if(activePlayLine===i && state===1){
   player.pauseVideo();
   updatePauseButton();
   updateLinePlayButtons();
   return;
 }
 if(activePlayLine===i && state===2){
   player.playVideo();
   updatePauseButton();
   updateLinePlayButtons();
   return;
 }
 activePlayLine=i;
 player.seekTo(Math.max(0,t),true);
 player.playVideo();
 updatePauseButton();
 setTimeout(updateLinePlayButtons,80);
}
function updateLinePlayButtons(){
 document.querySelectorAll('.linePlayBtn').forEach(b=>b.textContent='▶');
 if(activePlayLine==null||!player?.getPlayerState)return;
 let b=$('linePlay'+activePlayLine);
 if(b)b.textContent=player.getPlayerState()===1?'❚❚':'▶';
}
function toggleTiming(){timingMode=!timingMode;$('timing').classList.toggle('hidden',!timingMode);document.body.classList.toggle('timing-on',timingMode);$('lines').classList.toggle('hidden',timingMode);status()}
function markNext(){if(!player?.getCurrentTime||markIndex>=current.lines.length)return;current.lines[markIndex].startTime=+player.getCurrentTime().toFixed(2);markIndex++;save();renderLines();status()}
function undoMark(){if(!current||!current.lines.length)return;if(markIndex<=0&&current.lines[0].startTime==null)return;let i=Math.min(markIndex-1,current.lines.length-1);if(i<0)return;current.lines[i].startTime=null;markIndex=i;save();renderLines();status()}

function replayPrevious(){
 if(!current||!player?.seekTo)return;
 activePlayLine=null;
 let i=Math.max(0,Math.min(markIndex-1,current.lines.length-1)),t=current.lines[i]?.startTime;
 if(t==null){
   for(let j=i;j>=0;j--){if(current.lines[j].startTime!=null){t=current.lines[j].startTime;break}}
 }
 if(t==null)t=0;
 player.seekTo(Math.max(0,t-2),true);player.playVideo();updatePauseButton()
}
function togglePlayPause(){
 if(!player)return;
 let st=player.getPlayerState?.();
 if(st===1){player.pauseVideo()}else{player.playVideo()}
 setTimeout(updatePauseButton,100)
}
function updatePauseButton(){
 let b=$('pauseBtn');if(b&&player?.getPlayerState)b.textContent=player.getPlayerState()===1?'❚❚ 暫停':'▶ 繼續播放';
 updateLinePlayButtons();
}

function mergeNext(i){
 if(i<0||i>=current.lines.length-1)return;
 let a=current.lines[i],b=current.lines[i+1];
 if(!confirm(`合併這兩句？\\n\\n${a.text}\\n${b.text}`))return;
 a.text=(a.text.replace(/\s+$/,'')+' '+b.text.replace(/^\s+/,'')).trim();
 a.tokens=[{tokenId:'T1',text:a.text,reading:null,override:null}];
 if(a.startTime==null&&b.startTime!=null)a.startTime=b.startTime;
 current.lines.splice(i+1,1);save();recalcMarkIndex();renderLines();status()
}
function splitLine(i){
 let l=current.lines[i];
 let pos=prompt(`請輸入拆分位置的字元序號（1～${Math.max(1,l.text.length-1)}）。\\n\\n例如要在第 10 個字後拆開，就輸入 10。\\n\\n${l.text}`,'');
 if(pos===null)return;pos=parseInt(pos,10);
 if(!Number.isInteger(pos)||pos<=0||pos>=l.text.length){alert('拆分位置不正確');return}
 let left=l.text.slice(0,pos).trim(),right=l.text.slice(pos).trim();if(!left||!right){alert('拆分後兩句都必須有文字');return}
 l.text=left;l.tokens=[{tokenId:'T1',text:left,reading:null,override:null}];
 let nl={lineId:uid(),text:right,startTime:null,tokens:[{tokenId:'T1',text:right,reading:null,override:null}]};
 current.lines.splice(i+1,0,nl);save();recalcMarkIndex();renderLines();status()
}

function status(){
 if(!current)return;
 let done=markIndex>=current.lines.length;
 $('timingStatus').textContent=done?`已完成：${current.lines.length} / ${current.lines.length}`:`下一句：${markIndex+1} / ${current.lines.length}`;
 $('roughTiming').classList.toggle('hidden',done);$('fineTiming').classList.toggle('hidden',!done);$('markBtn').classList.toggle('hidden',done);
 if(done){renderFine();return}
 $('timingPrev').textContent=markIndex>0?current.lines[markIndex-1].text:'—';
 $('timingCurrent').textContent=current.lines[markIndex]?.text||'對時完成';
 $('timingNext').textContent=markIndex+1<current.lines.length?current.lines[markIndex+1].text:'—';
 $('currentEdit').innerHTML=`<button class="secondary" onclick="mergeNext(${markIndex})" ${markIndex>=current.lines.length-1?'disabled':''}>與下一句合併</button><button class="secondary" onclick="splitLine(${markIndex})">拆分這一句</button>`;
 updatePauseButton()
}
function renderFine(){
 if(!current)return;
 $('fineLines').innerHTML=current.lines.map((l,i)=>`<div class="line"><span class="muted time">${l.startTime==null?'--:--':fmt(l.startTime)}</span> ${renderText(l)}${l.startTime!=null?fineButtons(i):''}<div class="editline"><button class="secondary" onclick="mergeNext(${i})" ${i>=current.lines.length-1?'disabled':''}>與下一句合併</button><button class="secondary" onclick="splitLine(${i})">拆分</button></div></div>`).join(''); updateLinePlayButtons()
}
function shiftLine(i,d){let l=current?.lines?.[i];if(!l||l.startTime==null)return;l.startTime=Math.max(0,+(l.startTime+d).toFixed(2));save();renderLines();renderFine();status()}
function shiftAll(d){if(!current)return;current.lines.forEach(l=>{if(l.startTime!=null)l.startTime=Math.max(0,+(l.startTime+d).toFixed(2))});save();renderLines();renderFine()}
function syncLine(){if(!current||!player?.getCurrentTime)return;let t=player.getCurrentTime(),idx=-1;current.lines.forEach((l,i)=>{if(l.startTime!=null&&l.startTime<=t)idx=i});document.querySelectorAll('#lines .line').forEach(x=>x.classList.remove('active'));if(idx>=0){let e=$('line'+idx);if(e)e.classList.add('active')}}

function fmt(s){let m=Math.floor(s/60),x=(s%60).toFixed(1).padStart(4,'0');return m+':'+x}
function exportAll(){let b=new Blob([JSON.stringify({schemaVersion:1,exportedAt:new Date().toISOString(),songs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='japanese-lyrics-backup.json';a.click();URL.revokeObjectURL(a.href)}
async function importAll(f){if(!f)return;try{let d=JSON.parse(await f.text());if(d.schemaVersion!==1||!Array.isArray(d.songs))throw 0;if(confirm(`匯入 ${d.songs.length} 首歌曲？目前資料會被取代。`)){songs=d.songs;save();renderSongs()}}catch(e){alert('備份格式不正確或版本不支援')}}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.onYouTubeIframeAPIReady=()=>{};
renderSongs();
</script>
</body></html>
